prepare:
  test_size: 0.25
  seed: 42

train:
  embedding_model: sentence-transformers/all-MiniLM-L6-v2   # BERT-family sentence encoder
  top_n: 5
  ngram_ranges: [[1, 1], [1, 2], [1, 3]]
  diversities: [0.0, 0.3, 0.5, 0.7]
  min_improvement: 0.01   # new model must beat production by this much to be promoted
  tuning_samples: 500