services:
  mlflow:
    image: python:3.11-slim
    command: >
      sh -c "pip install --no-cache-dir mlflow==2.16.2 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:////mlflow/mlflow.db
             --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  api:
    build: .
    depends_on:
      - mlflow
    ports:
      - "8000:8000"
    volumes:
      - ./data/inference:/app/data/inference

volumes:
  mlflow-data:
